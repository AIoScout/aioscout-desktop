# Packaging config — sidecar resources are assembled by scripts/ in Phase 7.
appId: edu.aioscout.app
productName: AIoScout
directories:
  output: dist
files:
  - out/**
  - package.json
  - LICENSE
  - THIRD-PARTY-NOTICES.md
extraResources:
  # Populated by scripts/prepare-sidecars.sh + fetch-arduino-cli.sh +
  # build-arduino-bundle.sh — run those before electron-builder.
  - from: resources/mixly
    to: mixly
  - from: resources/training
    to: training
  - from: resources/arduino-cli
    to: arduino-cli
  - from: resources/Arduino15-seed
    to: Arduino15-seed
# Versionless artifact names: enables permanent "always latest" links like
#   https://github.com/AIoScout/aioscout-desktop/releases/latest/download/AIoScout-mac-arm64.dmg
# (the version is visible in the app itself and on the release page).
artifactName: ${productName}-${os}-${arch}.${ext}
mac:
  category: public.app-category.education
  identity: null  # unsigned distribution (see README)
  # Builds the runner's native arch — the arm64 and x64 dmg artifacts come
  # from the separate CI matrix entries (the sidecars are per-arch).
  target: dmg
  entitlements: build/entitlements.mac.plist
  hardenedRuntime: true
  extendInfo:
    NSCameraUsageDescription: AIoScout captures camera images to collect training data for your AI model.
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: true
